// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

def mapboxDownloadsToken = (providers.gradleProperty('MAPBOX_DOWNLOADS_TOKEN').orNull ?: System.getenv('MAPBOX_DOWNLOADS_TOKEN'))?.trim()

if (!mapboxDownloadsToken) {
  def envToken = null
  try {
    def candidates = [
      new File(rootDir.parentFile, ".env"),
      new File(rootDir, ".env")
    ]
    for (f in candidates) {
      if (f != null && f.exists()) {
        for (line in f.readLines('UTF-8')) {
          def m = (line =~ /^\s*(?:export\s+)?MAPBOX_DOWNLOADS_TOKEN\s*=\s*(.*)\s*$/)
          if (m.matches()) {
            def v = m[0][1].trim()
            if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith('\'') && v.endsWith('\''))) {
              v = v.substring(1, v.length() - 1)
            }
            envToken = v?.trim()
            break
          }
        }
      }
      if (envToken) break
    }
  } catch (Exception ignored) {}
  mapboxDownloadsToken = envToken?.trim()
}

if (!mapboxDownloadsToken) {
  throw new GradleException('MAPBOX_DOWNLOADS_TOKEN is required to download Mapbox native artifacts. Provide it via android/gradle.properties, OS env, or .env at project root.')
}

allprojects {
  repositories {
    maven {
      url 'https://api.mapbox.com/downloads/v2/releases/maven'
      authentication {
        basic(BasicAuthentication)
      }
      credentials {
        // Do not change the username below. It should always be "mapbox"
        username = "mapbox"
        // Use the secret token you stored in gradle.properties as the password
        password = mapboxDownloadsToken
      }
    }
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"



