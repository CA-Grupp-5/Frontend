name: Android APK Builds

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-apks:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    env:
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Dev (Debug)
            build-id: dev
            gradle-task: assembleDebug
            artifact-path: android/app/build/outputs/apk/debug/*.apk
            artifact-name: android-dev-apk
          - label: Release
            build-id: release
            gradle-task: assembleRelease
            artifact-path: android/app/build/outputs/apk/release/*.apk
            artifact-name: android-release-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Non-blocking quality checks
      - name: Lint (ESLint)
        run: bun lint
        continue-on-error: true

      - name: Typecheck (tsc)
        run: bun type
        continue-on-error: true

      - name: Tests (Jest)
        run: bunx jest --ci --runInBand
        continue-on-error: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: |
          set -euo pipefail
          task="${{ matrix.gradle-task }}"

          if [ -n "${MAPBOX_ACCESS_TOKEN:-}" ]; then
            export EXPO_PUBLIC_MAPBOX_TOKEN="$MAPBOX_ACCESS_TOKEN"
          fi

          if [ "${{ matrix.build-id }}" = "dev" ]; then
            export EXPO_USE_COMMUNITY_AUTOLINKING=1
          fi

          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --build-cache "$task" --stacktrace; then
              break
            elif [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed (attempt $attempt). Retrying in 15 seconds..."
              sleep 15
            else
              echo "Gradle build failed after $attempt attempts."
              exit 1
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
