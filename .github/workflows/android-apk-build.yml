name: Android APK Builds

on:
  push:
    branches:
      - post-apk-build2-login
  pull_request:
    branches:
      - post-apk-build2-login
  workflow_dispatch:

jobs:
  build-apks:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Dev (Debug)
            build-id: dev
            gradle-task: assembleDebug
            artifact-path: android/app/build/outputs/apk/debug/*.apk
            artifact-name: android-dev-apk
          - label: Release
            build-id: release
            gradle-task: assembleRelease
            artifact-path: android/app/build/outputs/apk/release/*.apk
            artifact-name: android-release-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: |
          if [ "${{ matrix.build-id }}" = "dev" ]; then
            EXPO_USE_COMMUNITY_AUTOLINKING=1 ./gradlew clean ${{ matrix.gradle-task }} --no-daemon
          else
            ./gradlew clean ${{ matrix.gradle-task }} --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
